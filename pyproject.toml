[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handwritten"
version = "0.1.0"
description = "Mobile IME handwritten Chinese character recognition"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "Pillow",
    "torch",
]

[tool.setuptools]
packages = ["src", "prepare", "save", "demo"]
